name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-linux:
    name: Linux - Lint, Invariants & Installation Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck setup.sh scripts/*.sh

      - name: Run make check test suite
        run: |
          make check

      - name: Test standalone setup.sh script
        run: |
          TEST_HOME=$(mktemp -d)
          HOME="$TEST_HOME" ./setup.sh
          test -f "$TEST_HOME/.config/uzdoom/autoexec.cfg"
          test -f "$TEST_HOME/.local/share/dsda-doom/dsda-doom.cfg"
          test -f "$TEST_HOME/.local/share/DoomRunner/options.json"
          test -f "$TEST_HOME/.local/share/doom-configs/presets.json"
          test -f "$TEST_HOME/.local/bin/doom-launch"
          ! grep -q '__HOME__' "$TEST_HOME/.local/share/DoomRunner/options.json"
          ! grep -q '__RESOLUTION__' "$TEST_HOME/.local/share/dsda-doom/dsda-doom.cfg"
          HOME="$TEST_HOME" "$TEST_HOME/.local/bin/doom-launch" --list
          rm -rf "$TEST_HOME"

      - name: Test CLI and automation tool interfaces
        run: |
          ./scripts/doom-launch.sh --list
          ./scripts/doom-launch.sh --preview "Alien Vendetta"
          ./scripts/fetch-wads.sh --list
          ./scripts/extract-iwads.sh --help
          ./scripts/install-soundfonts.sh --help

      - name: Verify Engine Downloader URL Resolution
        run: |
          # Verify that release URLs for all 3 targets can be resolved
          curl -sI https://api.github.com/repos/UZDoom/UZDoom/releases/latest | grep -i "status: 200" || true
          curl -sI https://api.github.com/repos/kraflab/dsda-doom/releases/latest | grep -i "status: 200" || true
          curl -sI https://api.github.com/repos/Youda008/DoomRunner/releases/latest | grep -i "status: 200" || true

  validate-macos:
    name: macOS - Invariants & Installation Test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run make check test suite
        run: |
          make check

      - name: Test standalone setup.sh script on macOS
        run: |
          TEST_HOME=$(mktemp -d)
          HOME="$TEST_HOME" ./setup.sh
          test -f "$TEST_HOME/Library/Application Support/uzdoom/autoexec.cfg"
          test -f "$TEST_HOME/Library/Application Support/dsda-doom/dsda-doom.cfg"
          test -f "$TEST_HOME/Library/Application Support/DoomRunner/options.json"
          test -f "$TEST_HOME/Library/Application Support/doom-configs/presets.json"
          test -f "$TEST_HOME/.local/bin/doom-launch"
          ! grep -q '__HOME__' "$TEST_HOME/Library/Application Support/DoomRunner/options.json"
          ! grep -q '__RESOLUTION__' "$TEST_HOME/Library/Application Support/dsda-doom/dsda-doom.cfg"
          HOME="$TEST_HOME" "$TEST_HOME/.local/bin/doom-launch" --list
          rm -rf "$TEST_HOME"

  validate-windows:
    name: Windows - PowerShell & Preset Validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON Files
        shell: pwsh
        run: |
          Get-Content -Raw "data/presets.json" | ConvertFrom-Json | Out-Null
          Get-Content -Raw "DoomRunner/windows/options.json" | ConvertFrom-Json | Out-Null
          Get-Content -Raw "DoomRunner/linux/options.json" | ConvertFrom-Json | Out-Null
          Write-Host "JSON files are valid."

      - name: Test setup.ps1 default installation
        shell: pwsh
        run: |
          # Execute setup.ps1
          .\setup.ps1
          
          # Verify files exist in both AppData directories
          $LocalOptions = "$env:LOCALAPPDATA\DoomRunner\options.json"
          $RoamingOptions = "$env:APPDATA\DoomRunner\options.json"
          
          if (-not (Test-Path $LocalOptions)) { throw "Missing $LocalOptions" }
          if (-not (Test-Path $RoamingOptions)) { throw "Missing $RoamingOptions" }
          
          # Test automatic backup on second run
          .\setup.ps1
          $LocalBackups = Get-ChildItem "$env:LOCALAPPDATA\DoomRunner" -Filter "options.json.bak.*"
          $RoamingBackups = Get-ChildItem "$env:APPDATA\DoomRunner" -Filter "options.json.bak.*"
          
          if ($LocalBackups.Count -eq 0) { throw "No backup file created in LocalAppData" }
          if ($RoamingBackups.Count -eq 0) { throw "No backup file created in AppData" }
          
          Write-Host "Default installation and backup tests passed."

      - name: Test setup.ps1 with custom BaseDrive remapping
        shell: pwsh
        run: |
          .\setup.ps1 -BaseDrive "D:"
          $Content = Get-Content -Raw "$env:LOCALAPPDATA\DoomRunner\options.json"
          if ($Content -match "E:/Doom WADS") { throw "Drive remapping failed; found E:/Doom WADS" }
          if (-not ($Content -match "D:/Doom WADS")) { throw "Drive remapping failed; missing D:/Doom WADS" }
          Write-Host "BaseDrive remapping test passed."

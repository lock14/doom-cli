name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-linux:
    name: Linux - Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Go test suite
        run: |
          go test -v ./...

      - name: Run make check
        run: |
          make check

      - name: Verify CLI commands
        run: |
          ./bin/doom --help
          ./bin/doom presets list
          ./bin/doom wads list
          ./bin/doom setup --help

  validate-macos:
    name: macOS - Test & Build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Go test suite
        run: |
          go test -v ./...

      - name: Run make check
        run: |
          make check

      - name: Verify CLI commands
        run: |
          ./bin/doom --help
          ./bin/doom presets list
          ./bin/doom wads list

  validate-windows:
    name: Windows - Test & Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Go test suite
        shell: pwsh
        run: |
          go test -v ./...

      - name: Build native Windows executable
        shell: pwsh
        run: |
          go build -o bin\doom.exe .\cmd\doom

      - name: Verify Windows CLI commands
        shell: pwsh
        run: |
          .\bin\doom.exe --help
          .\bin\doom.exe presets list
          .\bin\doom.exe wads list
          .\bin\doom.exe setup --help

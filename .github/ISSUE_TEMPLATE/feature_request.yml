name: Feature request
description: Propose a new preset, engine integration, CLI feature, or configuration profile enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - "New preset or engine (catalog/*.json)"
        - "CLI feature (cmd/doom)"
        - "Engine support or configuration profile"
        - "Game asset extraction or WAD fetching"
        - "Interactive TUI launcher"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Workflow limitation, missing megawad preset, or engine requirement this proposal addresses.
      placeholder: Describe the workflow problem or use case...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and implementation details
      description: |
        Describe the proposed CLI behavior, schema changes, or preset details (megawad title, engine choice, IWAD, PWAD load order, DeHackEd patch, and idgames download URL).
      placeholder: |
        Preset name: ...
        Engine: dsda-doom or uzdoom
        IWAD: DOOM2.WAD
        PWADs: ...
        Download URLs: ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Alternative approaches or workarounds evaluated.
    validations:
      required: false

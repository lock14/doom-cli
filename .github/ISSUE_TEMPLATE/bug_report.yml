name: Bug report
description: Report a bug, launch failure, download issue, or unexpected behavior in doom-cli
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Subsystem experiencing the issue.
      options:
        - "CLI: doom [wad] (direct launcher)"
        - "CLI: doom wads (interactive TUI and WAD manager)"
        - "CLI: doom engines (engine binaries, overrides, and cfg)"
        - "CLI: doom config (CLI settings and themes)"
        - "CLI: doom setup"
        - "Source port config: DSDA-Doom"
        - "Source port config: UZDoom"
        - "Catalog: presets and overrides (catalog/ and catalog.d/)"
        - "Other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      description: Operating system and CPU architecture (such as Ubuntu 24.04 amd64, macOS Sonoma arm64, or Windows 11 x64).
      placeholder: Linux x86_64
    validations:
      required: true

  - type: input
    id: doom-version
    attributes:
      label: Doom CLI version
      description: Output of `doom --version` or commit SHA.
      placeholder: v1.0.0 or commit 99b4f70
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered commands or steps executed to reproduce the issue.
      placeholder: |
        1. Run `doom setup`
        2. Launch preset "Eviternity II" with `doom "Eviternity II"`
        3. Observe error output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Deterministic behavior expected from the command or preset.
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and terminal output
      description: Exact terminal output, error messages, or engine crash logs.
      render: shell
      placeholder: |
        Paste terminal output or error logs here...
    validations:
      required: true
